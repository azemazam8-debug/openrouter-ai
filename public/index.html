<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Saya</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      padding: 18px;
      background: #111827;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .assistant {
      background: #e5e7eb;
      color: #111827;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 50px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>🤖 AI Saya</header>

    <div id="chat">
      <div class="message assistant">
        Halo! Saya AI berbasis OpenRouter. Ada yang bisa saya bantu?
      </div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="Tulis pesan..."></textarea>
      <button id="send">Kirim</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const messages = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || send.disabled) return;

      input.value = "";
      send.disabled = true;

      addMessage(text, "user");
      messages.push({
        role: "user",
        content: text
      });

      const loading = addMessage("AI sedang mengetik...", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Terjadi kesalahan");
        }

        loading.textContent = data.answer;

        messages.push({
          role: "assistant",
          content: data.answer
        });

      } catch (error) {
        loading.textContent = "Error: " + error.message;
      }

      send.disabled = false;
      input.focus();
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
